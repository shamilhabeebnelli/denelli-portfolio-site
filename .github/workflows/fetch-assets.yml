name: fetch-assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-assets.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site images from the live site
        run: |
          for f in favicon.png icon-192.png apple-touch-icon.png logo-dark.png og.jpg passport.webp portrait.jpg; do
            curl -fsSL "https://www.denelli.in/$f" -o "$f"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add favicon.png icon-192.png apple-touch-icon.png logo-dark.png og.jpg passport.webp portrait.jpg
          git commit -m "Add site images" || exit 0
          git push
