name: code-upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/code-upgrade.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the structured site source
        run: |
          echo '' | base64 -d > /tmp/bundle.tgz
          tar xzf /tmp/bundle.tgz
      - name: Check
        run: |
          node --test tests/*.mjs
          cmp <(node -e "import('./scripts/build.mjs').then(m=>process.stdout.write(m.build({write:false})))") index.html
      - name: Commit and remove this one-off workflow
        run: |
          git rm -q .github/workflows/code-upgrade.yml
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restructure site into modular CSS and JS with build script and tests"
          git push
